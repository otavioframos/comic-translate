<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Comic Translate</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: #1f2937;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 650;
      }

      label {
        display: block;
        margin-top: 10px;
        font-weight: 600;
      }

      input,
      select,
      button {
        box-sizing: border-box;
        width: 100%;
        margin-top: 5px;
        border-radius: 6px;
        font: inherit;
      }

      input,
      select {
        border: 1px solid #cbd5e1;
        padding: 7px 8px;
        background: #fff;
      }

      button {
        border: 0;
        padding: 9px 10px;
        background: #1f2937;
        color: #fff;
        font-weight: 650;
        cursor: pointer;
      }

      button.secondary {
        background: #eef2f7;
        color: #1f2937;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .actions {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }

      #status {
        min-height: 18px;
        margin-top: 10px;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <h1>Comic Translate</h1>

    <label for="serverUrl">Local server</label>
    <input id="serverUrl" type="url" spellcheck="false">

    <div class="row">
      <label>
        Source
        <select id="sourceLang">
          <option>Japanese</option>
          <option>Korean</option>
        </select>
      </label>
      <label>
        Target
        <select id="targetLang">
          <option>English</option>
        </select>
      </label>
    </div>

    <div class="actions">
      <button id="save">Save Settings</button>
      <button id="translateLargest" class="secondary">Translate Visible Image</button>
    </div>

    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
